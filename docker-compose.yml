services:
  labelcheck:
    build: .
    ports:
      - "8123:8123"
    mem_limit: 4g          # PaddleOCR + buffers; exit 137 during warmup = raise this
    environment:
      - PORT=8123
    env_file:                  # host .env → container env (registry pipelines key)
      - path: .env
        required: false        # compose runs fine when .env doesn't exist yet
