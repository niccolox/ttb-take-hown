# CI (audit F1): every gate that existed only as a manual ritual now runs on
# every push — the hash-locked install proves the lock, pytest proves the
# suite, the no-egress check proves the firewall story, pip-audit watches
# the dependency set (F7). The heavier image job (paddle bake + integrity
# gate + trivy) runs weekly and on demand: the bake downloads ~100MB of
# model weights, which is too slow and flaky for per-push.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly image + scan (Mon 06:17 UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - name: Hash-locked install (supply-chain gate)
        run: pip install --require-hashes -r api/requirements.lock
      - name: Unit + integration suite
        run: python -m pytest api/tests/ -q
      - name: No-egress proof (firewall story, byte-level)
        run: python scripts/no_egress_check.py
      - name: Dependency audit (advisories against the locked set)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true   # advisory: report, don't block (F7 ritual decides upgrades)

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: axe-core scan (WCAG 2.0 A/AA + Section 508), static-served UI
        run: |
          mkdir -p /tmp/axe && cp scripts/axe_scan.mjs /tmp/axe/
          cd /tmp/axe
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund puppeteer-core axe-core http-server >/dev/null 2>&1
          npx http-server "$GITHUB_WORKSPACE/api/web" -p 8098 --silent &
          sleep 2
          node axe_scan.mjs http://127.0.0.1:8098

  image:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs the post-bake model integrity gate)
        run: docker build -t labelcheck:ci .
      - name: Assert non-root runtime
        run: test "$(docker run --rm labelcheck:ci id -u)" = "1000"
      - name: Assert no data baked in
        run: |
          docker run --rm labelcheck:ci sh -c '! test -e /app/api/data && ! test -e /app/api/eval/colacloud'
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: labelcheck:ci
          severity: HIGH,CRITICAL
          exit-code: "0"        # report-only until the baseline is triaged
